<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Late-Resolution Winner Trading 策略流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      justify-content: center;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    svg { display: block; width: 100%; min-width: 960px; }
    footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(45,49,66,0.12);
      color: var(--soft);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">FLOWCHART · POLYPULSE · DRY-RUN VALIDATION</p>
    <h1>Late-Resolution Winner Trading 策略流程</h1>
    <p class="subtitle">临近5分钟市场结束时，候选高概率单腿必须依次通过盘口、Chainlink TWAP、连续确认与资金风控；成交后不止损，持有到真实终局。</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="late-resolution-winner-trading-flow-title late-resolution-winner-trading-flow-desc">
      <title id="late-resolution-winner-trading-flow-title">Late-Resolution Winner Trading 策略流程</title>
      <desc id="late-resolution-winner-trading-flow-desc">流程图展示 Late-Resolution Winner Trading 从最后六十秒扫描、盘口候选、Chainlink 独立模型、连续确认、风险检查、FAK 成交模拟，到持有并按真实终局结算的完整门控流程。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors: primary path -->
      <line x1="480" y1="88" x2="480" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="184" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="296" x2="480" y2="320" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="480" y1="392" x2="480" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="488" x2="480" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="584" x2="480" y2="608" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connectors: rejection branches -->
      <line x1="624" y1="148" x2="920" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="252" x2="920" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="624" y1="356" x2="920" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="624" y1="452" x2="920" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="624" y1="548" x2="920" y2="548" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connector labels: masks preserve visible stroke gaps -->
      <rect x="500" y="188" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">候选</text>
      <rect x="500" y="300" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="308" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">通过</text>
      <rect x="500" y="396" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">3次</text>
      <rect x="500" y="492" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">允许</text>
      <rect x="500" y="588" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">有成交</text>

      <rect x="736" y="128" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">无候选</text>
      <rect x="736" y="232" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">任一拒绝</text>
      <rect x="728" y="336" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">未连续确认</text>
      <rect x="736" y="432" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">风控拒绝</text>
      <rect x="736" y="528" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">零成交</text>

      <!-- Start -->
      <rect x="360" y="40" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">进入市场最后 60 秒</text>
      <text x="480" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">每窗口最多 1 次订单尝试</text>

      <!-- Candidate decision -->
      <polygon points="480,112 624,148 480,184 336,148" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">CLOB 盘口形成赢家候选？</text>
      <text x="480" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">赢家 ask 0.95–0.98 · 对手 ≤0.10 / 无 ask</text>

      <!-- Independent model decision: focal -->
      <polygon points="480,208 640,252 480,296 320,252" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="480" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">独立 Chainlink 模型全部通过？</text>
      <text x="480" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">opening/current TWAP · 新鲜度 · 样本数</text>
      <text x="480" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">spread/深度 · 反转边界 · net EV</text>
      <text x="480" y="280" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">p_model − 有效价格 − 模型缓冲 ≥ 0.002</text>

      <!-- Confirmation decision -->
      <polygon points="480,320 624,356 480,392 336,356" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">连续 3 个新 TWAP 同方向？</text>
      <text x="480" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">相同 timestamp 不重复计数 · 任一拒绝即重置</text>

      <!-- Risk decision -->
      <polygon points="480,416 624,452 480,488 336,452" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">资金与风险额度允许？</text>
      <text x="480" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">paper cash · 总敞口 · 亏损熔断 · 次数限制</text>

      <!-- Execution/fill decision -->
      <polygon points="480,512 624,548 480,584 336,548" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">FAK 执行后有成交？</text>
      <text x="480" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">dry-run 遍历真实深度 · 可部分成交</text>
      <text x="480" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">按实际均价与 fee buffer 扣虚拟资金</text>

      <!-- Settlement outcome -->
      <rect x="320" y="608" width="320" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Pending 持有至真实终局并结算</text>
      <text x="480" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">closed=true + 1/0 · 胜赚小额，败损近全部成本</text>

      <!-- Rejection rail -->
      <rect x="920" y="112" width="240" height="472" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="940" y="132" width="56" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="968" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle" letter-spacing="0.08em">REJECT</text>
      <text x="1040" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">本轮跳过</text>
      <text x="1040" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">不发送真实交易</text>
      <text x="1040" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">不消耗未使用资金</text>
      <text x="1040" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">模型失败会重置连续确认</text>
      <line x1="960" y1="376" x2="1120" y2="376" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="1040" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">核心拒绝原因</text>
      <text x="1040" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">NO BOOK / NO SIGNAL</text>
      <text x="1040" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">STALE / NO OPENING / LOW SAMPLES</text>
      <text x="1040" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">SPREAD / DEPTH / REVERSAL / NET EV</text>
      <text x="1040" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">RISK / NO FILL</text>

      <!-- Legend strip -->
      <line x1="40" y1="672" x2="1240" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" letter-spacing="0.14em">图例 · 形状表达语义</text>
      <rect x="240" y="684" width="32" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="284" y="696" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans SC',sans-serif">起点 / 终局</text>
      <polygon points="432,692 448,684 464,692 448,700" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="476" y="696" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans SC',sans-serif">门控决策</text>
      <polygon points="624,692 640,684 656,692 640,700" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="668" y="696" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans SC',sans-serif">独立概率裁决</text>
      <rect x="848" y="684" width="32" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="892" y="696" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans SC',sans-serif">拒绝 / 本轮跳过</text>
      <line x1="1080" y1="692" x2="1112" y2="692" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="1124" y="696" fill="#4f5d75" font-size="8" font-family="'Geist','Noto Sans SC',sans-serif">状态转移</text>
    </svg>

    <footer>基于当前代码与 .env：WINNER_BUY_BEFORE_END_SECS=60 · CONFIRMATION_OBSERVATIONS=3 · MIN_NET_EV=0.002 · DRY_RUN=true</footer>
  </main>
</body>
</html>
